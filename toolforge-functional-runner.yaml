# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
components:
  runner:
    build:
      repository: https://github.com/DamianZaremba/toolforge-functional-runner.git
      ref: refs/tags/v1.1.4
    run:
      command: run
      port: 9091
      health_check_http: /
  grafana-alloy:
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v0.9.0
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
