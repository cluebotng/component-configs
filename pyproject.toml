[project]
name = "cluebotng-component-configs"
requires-python = ">=3.13"
dependencies = [
    "fabric>=3.2.3",
    "requests>=2.34.2",
    "PyYAML>=6.0.3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = ">=4.67.4"
tox-current-env = ">=0.0.17"
black = ">=26.10.1"
ruff = ">=0.17.3"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
