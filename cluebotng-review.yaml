# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
defaults:
  alerts:
    notify: true
components:
  # Core services
  cluebotng-reviewer:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/reviewer.git
      ref: refs/tags/v2.10.0
    run:
      command: web
      port: 8000
      publish: /
      replicas: 2
      memory: 2Gi
      health_check_http: /internal/health/
  celery-worker:
    component_type: continuous
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: run-celery
      replicas: 2
      memory: 2Gi
  # Runtime dependencies
  redis:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/external-redis.git
      ref: refs/tags/v1.10.0
    run:
      command: redis-server
      port: 6379
      mount: all
  # Helper services
  irc-relay:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/irc-relay.git
      ref: refs/tags/v4.9.0
    run:
      command: run-server
      port: 9334
      health_check_http: /health
  celery-flower:
    component_type: continuous
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: run-flower
      port: 5555
      health_check_http: /healthcheck
      replicas: 2
  grafana-alloy:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v1.8.0
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
  pushgateway:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/external-pushgateway.git
      ref: refs/tags/v0.10.0
    run:
      command: run-pushgateway
      port: 9091
      health_check_http: /-/healthy
      mount: all
  monitoring-toolforge:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/monitoring-toolforge.git
      ref: refs/tags/v2.10.0
    run:
      command: run
      port: 8000
      health_check_http: /health
      mount: all
  core:
    component_type: continuous
    build:
      repository: https://github.com/cluebotng/external-core.git
      ref: refs/tags/v1.14.0
    run:
      command: ./cluebotng -l -m live_run
      port: 3565
      health_check_script: bash -c 'nc localhost 3565 <<< "<WPEditSet />"'
  # Scheduled jobs
  ## Core jobs
  export-statistics:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py export_statistics
      schedule: 13 9 * * *
      timeout: 3600
  update-edit-classifications:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py update_edit_classification
      schedule: 30 */2 * * *
      timeout: 3600
  ## Seed jobs
  add-reported-edits:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py add_reported_edits
      schedule: 55 * * * *
      timeout: 3600
  ## Helper jobs
  add-reviews-from-report:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py add_reviews_from_report
      schedule: 15 * * * *
      timeout: 3600
  add-reviews-from-huggle:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py add_reviews_from_huggle
      schedule: 23 */2 * * *
      timeout: 3600
  ## Back-fill jobs
  import-training-data:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py import_training_data
      schedule: 15 2 * * *
      timeout: 3600
  mark-edits-as-deleted:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py mark_edits_as_deleted
      schedule: 13 4 * * *
      timeout: 3600
  mark-edits-as-having-data:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py mark_edits_with_training_data
      schedule: 13 3 * * *
      timeout: 3600
  add-dangling-edits-to-group:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py add_dangling_edits_to_group
      schedule: 13 21 * * *
      timeout: 3600
  ## Management jobs
  cleanup-user-records:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py cleanup_user_records
      schedule: 13 1 * * *
      timeout: 3600
  update-user-usernames:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py update_usernames
      schedule: 13 2 * * *
      timeout: 3600
  auto-grant-reviewer-access:
    component_type: scheduled
    build:
      reuse_from: cluebotng-reviewer
    run:
      command: ./manage.py auto_grant_reviewer_access
      schedule: 27 * * * *
      timeout: 3600
  ## Backups
  backup-database:
    component_type: scheduled
    build:
      repository: https://github.com/cluebotng/external-utilities.git
      ref: refs/tags/v2.1.0
    run:
      command: scripts/database-to-object-store.py --dump-per-table
      schedule: '45 */4 * * *'
      timeout: 10800
  backup-database-daily:
    component_type: scheduled
    build:
      repository: https://github.com/cluebotng/external-utilities.git
      ref: refs/tags/v2.1.0
    run:
      command: scripts/database-to-nfs.py --dump-per-table
      schedule: '13 1 * * *'
      timeout: 10800
      mount: all
  prune-backups:
    component_type: scheduled
    build:
      reuse_from: backup-database
    run:
      command: scripts/prune-nfs-backups.py
      schedule: '30 5 * * *'
      timeout: 3600
      mount: all
