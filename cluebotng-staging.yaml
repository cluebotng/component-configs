# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
components:
  core:
    build:
      repository: https://github.com/cluebotng/external-core.git
      ref: refs/tags/v1.7.1
    run:
      command: ./cluebotng -l -m live_run
      port: 3565
      health_check_script: bash -c 'nc localhost 3565 <<< "<WPEditSet />"'
  reporter-interface:
    build:
      repository: https://github.com/cluebotng/reporter.git
      ref: refs/tags/v2.1.2
    run:
      command: web
      port: 8000
      publish: /
      health_check_http: internal/health/
  grafana-alloy:
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v1.1.2
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
  monitoring-toolforge:
    build:
      repository: https://github.com/cluebotng/monitoring-toolforge.git
      ref: refs/tags/v2.3.1
    run:
      command: run
      port: 8000
      health_check_http: /health
      mount: all
  redis:
    build:
      repository: https://github.com/cluebotng/external-redis.git
      ref: refs/tags/v1.3.3
    run:
      command: redis-server
      port: 6379
