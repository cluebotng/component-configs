# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
components:
  # Core services - see utilities repo (until components-api is stable)
  core:
    build:
      repository: https://github.com/cluebotng/external-core.git
      ref: refs/tags/v1.6.1
    run:
      command: ./cluebotng -l -m live_run
      port: 3565
      memory: 1Gi
      cpu: '1'
      health_check_script: bash -c 'nc localhost 3565 <<< "<WPEditSet />"'
  bot:
    build:
      repository: https://github.com/cluebotng/bot.git
      ref: refs/tags/v5.4.2
    run:
      command: run-cbng
      port: 9095
      memory: 2Gi
      cpu: '1'
      health_check_script: health-check
  # Supporting services
  redis:
    build:
      repository: https://github.com/cluebotng/external-redis.git
      ref: refs/tags/v1.2.2
    run:
      command: redis-server
      port: 6379
  irc-relay:
    build:
      repository: https://github.com/cluebotng/irc-relay.git
      ref: refs/tags/v4.1.1
    run:
      command: run-server
      port: 9334
      health_check_http: /health
  # Report interface
  reporter-interface:
    build:
      repository: https://github.com/cluebotng/reporter.git
      ref: refs/tags/v1.4.4
    run:
      command: web
      port: 8000
      publish: /
      health_check_http: internal/health/
      replicas: 2
  report-review-import:
    build:
      reuse_from: reporter-interface
    run:
      command: ./manage.py import_review_statuses
      schedule: '5 * * * *'
      timeout: 3600
  report-sync-admin-rights:
    build:
      reuse_from: reporter-interface
    run:
      command: ./manage.py sync_admin_rights
      schedule: '13 * * * *'
      timeout: 3600
  report-send-whitelisted-to-review:
    build:
      reuse_from: reporter-interface
    run:
      command: ./manage.py send_whitelisted_users_to_review
      schedule: '45 2 * * *'
      timeout: 3600
  # Monitoring
  grafana-alloy:
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v1.0.2
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
  pushgateway:
    build:
      repository: https://github.com/cluebotng/external-pushgateway.git
      ref: refs/tags/v0.2.2
    run:
      command: run-pushgateway
      port: 9091
      health_check_http: /-/healthy
      mount: all
  monitoring-toolforge:
    build:
      repository: https://github.com/cluebotng/monitoring-toolforge.git
      ref: refs/tags/v2.2.2
    run:
      command: run
      port: 8000
      health_check_http: /health
      mount: all
  ## Backups
  backup-database:
    build:
      repository: https://github.com/cluebotng/external-utilities.git
      ref: refs/tags/v1.5.1
    run:
      command: bash -c 'mkdir -p /data/project/cluebotng/mysql_backups/ && mysqldump --defaults-file=/data/project/cluebotng/replica.my.cnf -h tools-db s52585__cb | gzip -9 > /data/project/cluebotng/mysql_backups/$(date +"%Y%m%dT%H%M%S").sql.gz'
      schedule: '45 */2 * * *'
      timeout: 10800
      mount: all
  prune-backups:
    build:
      reuse_from: backup-database
    run:
      command: bash -c 'find "/data/project/cluebotng/mysql_backups" -mtime +7 -delete'
      schedule: '30 5 * * *'
      timeout: 3600
      mount: all
