components:
  cluebot3:
    build:
      repository: https://github.com/cluebotng/cluebot3.git
      ref: feature/add-index-cleanup-script
    run:
      command: run-bot
      memory: 1Gi
      cpu: '2'
      health_check_script: health-check
  # Cleanup
  run-cleanup:
    build:
      reuse_from: cluebot3
    run:
      command: run-cleanup
      memory: 1Gi
      cpu: '2'
      schedule: '13 1 * * 1'
      timeout: 432000 # 5 days
  # Monitoring
  grafana-alloy:
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v0.7.0
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
  monitoring-toolforge:
    build:
      repository: https://github.com/cluebotng/monitoring-toolforge.git
      ref: refs/tags/v2.0.0
    run:
      command: run
      port: 8000
      health_check_http: /health
      mount: all
