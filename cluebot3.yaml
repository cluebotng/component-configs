# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
components:
  cluebot3:
    build:
      repository: https://github.com/cluebotng/cluebot3.git
      ref: refs/tags/v5.3.0
    run:
      command: run-bot
      memory: 1Gi
      cpu: '2'
      health_check_script: health-check
  # Cleanup
  run-cleanup:
    build:
      reuse_from: cluebot3
    run:
      command: run-cleanup
      memory: 1Gi
      cpu: '2'
      schedule: '13 1 * * *'
      timeout: 21600 # 6 hours
  # Monitoring
  grafana-alloy:
    build:
      repository: https://github.com/cluebotng/external-grafana-alloy.git
      ref: refs/tags/v1.0.1
    run:
      command: run-alloy
      port: 8118
      health_check_http: /health
      mount: all
  monitoring-toolforge:
    build:
      repository: https://github.com/cluebotng/monitoring-toolforge.git
      ref: refs/tags/v2.2.0
    run:
      command: run
      port: 8000
      health_check_http: /health
      mount: all
