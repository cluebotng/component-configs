name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@24df2aaf6751d405fc81ab730fcefabe4e0bbab9 # main

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@4e786de676c2efdd6d892721d93480c7e6c621ad # main
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@4e786de676c2efdd6d892721d93480c7e6c621ad # main
    with:
      environments: ${{ needs.setup-build.outputs.test }}
      install_dependencies: true
