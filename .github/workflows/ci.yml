name: CI
on: { pull_request: { } }
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  setup-build:
    uses: infrabits/ci-setup-tox-env/.github/workflows/setup.yml@695295044782014d7770412205288bb2fce4bf38 # main

  execute-lint:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@a574a8250345b3ea42f265ddff4c933924ee71c3 # main
    with:
      environments: ${{ needs.setup-build.outputs.lint }}

  execute-test:
    needs: [setup-build]
    uses: infrabits/ci-run-tox-env/.github/workflows/run.yml@a574a8250345b3ea42f265ddff4c933924ee71c3 # main
    with:
      environments: ${{ needs.setup-build.outputs.test }}
      install_dependencies: true
